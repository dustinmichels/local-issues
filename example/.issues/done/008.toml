[issue]
id = 8
title = "Implement Scoped CSS for Custom Sections"
status = "done"         # [open, in-progress, done]
assigned_to = ""        # [claude, antigravity, ""]
created_at = 2026-06-10
completed_at = 2026-06-10

[details]
description = """
Custom sections used unscoped <style> blocks and generic class names
(.left-content, .right-content, .cta-button, .store-grid, .store-image),
risking global style leaks across the theme.
"""

[tasks]
"Enclose style blocks in custom sections within Liquid {% style %} tags scoped to the section ID (#shopify-section-{{ section.id }})" = true
"Scope styles for generic classes (.left-content, .right-content, .cta-button, .store-grid, .store-image) to prevent global style leaks" = true
"Move inline CSS out of <style> blocks in Liquid sections (e.g. first-row.liquid, calendar.liquid) and load via scoped stylesheets" = true

[resolution]
notes = ""
